name: CI
# CI/CD: GitHub Actions
# STACK LOCK: repository CI remains GitHub Actions while runtime stack transitions to locked targets.
# DEPLOY: Docker Compose + Traefik deployment flow is documented in README and validated manually for OSS self-host.

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
